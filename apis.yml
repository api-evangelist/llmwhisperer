aid: llmwhisperer
url: https://raw.githubusercontent.com/api-evangelist/llmwhisperer/refs/heads/main/apis.yml
name: LLMWhisperer
kind: company
description: LLMWhisperer is a document-to-text extraction API from Unstract (Zipstack)
  that turns complex PDFs, scanned documents, and images into clean, layout-preserving
  text ready for large language models. It exposes an asynchronous REST API (v2) -
  submit a document to /whisper, poll /whisper-status, then retrieve the extracted
  text via /whisper-retrieve - plus line-level highlight coordinates and webhook
  callbacks. Authentication is via the unstract-key header.
