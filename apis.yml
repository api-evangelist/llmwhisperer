  - url: https://docs.unstract.com/llmwhisperer/llm_whisperer/apis/llm_whisperer_text_extraction_status_api/
    type: Documentation
  - url: openapi/llmwhisperer-openapi.yml
    type: OpenAPI
  - url: collections/llmwhisperer.postman_collection.json
