principles:
- name: Visibility
  description: Use the tag parameter and the usage / get-usage-info endpoints to attribute pages per workload.
- name: Allocation
  description: Tag whisper requests per team or document type; map tags to internal cost centers.
- name: Optimization
  description: Pick the lowest sufficient mode (native_text for digital PDFs); use pages_to_extract to avoid processing unneeded pages; stay within the free daily allowance where possible.
- name: Accountability
  description: Assign owners per tag/workload and review page burn monthly against budget.
