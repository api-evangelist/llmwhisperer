description: >-
  FinOps view of LLMWhisperer spend. LLMWhisperer bills usage-based per-page
  rates that vary by extraction mode (native_text, low_cost, high_quality,
  form/table), with a free allowance of 100 pages per day. Cost is driven by
  the number of pages processed and the mode selected, so the primary
  optimization levers are choosing the lowest sufficient mode and limiting
  pages_to_extract to only the pages needed.
notes: >-
  Per-mode per-page rates are subject to change; verify against the Unstract /
  LLMWhisperer pricing page during reconciliation.
